        content="¿Tenés dudas sobre el mate o la yerba? Escribinos por el formulario de contacto y te respondemos a la brevedad.">

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid d-flex flex-column align-items-center">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/img/logomate.jpg" alt="Logo de InfoMates" height="50">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-center">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html"><b>INICIO</b></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contacto.html"><b>CONTACTO</b></a>

                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="text-center">Dejanos tu contacto y nos vamos a comunicar con vos!</h1>

        <form class="mx-auto form-contacto">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="6"
                    placeholder="Escribí tu mensaje acá..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="footer d-flex flex-column align-items-center text-center">
        <nav>
            <p>Las Rede Sosiale</p>

                <li><a href="https://facebook.com" target="_blank"><b>FACEBOOK</b></a></li>

        AOS.init();
